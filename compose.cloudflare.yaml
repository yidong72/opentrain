# Optional dedicated Cloudflare Tunnel; see docs/deployment-brev.md.
services:
  open-train:
    environment:
      OPEN_TRAIN_AUTH_MODE: accounts
      OPEN_TRAIN_PUBLIC_URL: ${OPEN_TRAIN_PUBLIC_URL:?Set your HTTPS public origin in .env}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    user: "1000:1000"
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "--no-autoupdate", "run"]
    volumes:
      - ./deploy/cloudflared.yml:/etc/cloudflared/config.yml:ro
      - ./secrets/cloudflared.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      open-train:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
