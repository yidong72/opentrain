[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-train"
version = "0.1.0"
description = "Self-hosted experiment tracking with the official W&B Python client"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "graphql-core>=3.2,<3.3", "httpx>=0.27,<1", "pyyaml>=6,<7",
  "tensorboard>=2.18,<3",
  "authlib>=1.6,<2", "itsdangerous>=2.2,<3",
]

[project.scripts]
open-train = "open_train.cli:main"

[project.optional-dependencies]
client = ["wandb>=0.28.2,<0.31"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "wandb==0.29.0", "playwright>=1.50,<2", "pillow>=11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real W&B client talking to a local HTTP server"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.isort]
# Local SDK logs create a wandb/ directory; it is not a first-party package.
known-third-party = ["wandb"]

[tool.hatch.build.targets.wheel]
packages = ["open_train"]
